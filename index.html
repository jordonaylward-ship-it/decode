<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src blob: https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<title>Cipher</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--txt:#f5f5f7;--dim:#8e8e93;--mut:#636366;--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1100px;margin:0 auto;padding:28px 22px 60px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hdr h1{font-size:30px;font-weight:700;letter-spacing:-.4px}
.hdr p{font-size:13px;color:var(--dim);margin-top:2px}
.words{font-size:13px;color:var(--dim);text-align:right;display:flex;align-items:center;gap:10px}
.words b{color:var(--txt);font-weight:600;letter-spacing:.08em}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px;margin:0 10px 18px 0}
.seg button{background:transparent;border:none;color:var(--dim);font:inherit;font-size:13px;font-weight:600;padding:7px 18px;border-radius:8px;cursor:pointer;transition:all .15s}
.seg button.on{background:#3a3a3c;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:16px 18px 14px;display:flex;flex-direction:column;min-height:340px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h2{font-size:15px;font-weight:600}
.ch .st{font-size:12px;color:var(--dim)}
textarea{flex:1;width:100%;min-height:240px;background:transparent;border:none;color:var(--txt);font:inherit;font-size:15px;line-height:1.55;resize:vertical;outline:none}
textarea::placeholder{color:var(--mut)}
#out{color:#e5e5ea;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;word-break:break-all}
.pill{background:var(--card2);border:none;color:var(--blue);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.pill:hover{filter:brightness(1.15)}
.pill.ghost{color:var(--dim)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #2c2c2e;font-size:12px;color:var(--mut)}
.drop{margin-top:10px;border:1.5px dashed #3a3a3c;border-radius:12px;padding:12px;text-align:center;color:var(--dim);font-size:12.5px;cursor:pointer}
.drop.on{border-color:var(--blue);color:var(--txt)}
.note{font-size:12.5px;color:var(--mut);margin-top:16px;line-height:1.55}
.lock{max-width:520px;margin:40px auto 0;background:var(--card);border-radius:20px;padding:26px 26px 22px}
.lock h2{font-size:20px;font-weight:700;margin-bottom:4px}
.lock p{font-size:13px;color:var(--dim);margin-bottom:18px;line-height:1.5}
.lock label{display:block;font-size:12px;color:var(--dim);font-weight:500;margin:12px 0 6px}
.lock input[type=text]{width:100%;background:var(--card2);border:none;border-radius:10px;padding:12px 14px;color:var(--txt);font:inherit;font-size:16px;letter-spacing:.12em;text-transform:uppercase;outline:none}
.lock input[type=text]:focus{box-shadow:0 0 0 2px var(--blue)}
.lock .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.tog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);cursor:pointer}
.tog input{appearance:none;width:42px;height:24px;border-radius:12px;background:#3a3a3c;position:relative;cursor:pointer;transition:background .2s;flex:none}
.tog input:checked{background:var(--green)}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .2s}
.tog input:checked::after{left:20px}
.btn{background:var(--blue);border:none;color:#fff;font:inherit;font-size:14px;font-weight:600;padding:11px 20px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.check{font-size:12.5px;margin-top:8px;color:var(--dim)}.check.ok{color:var(--green)}.check.bad{color:var(--orange)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c2c2e;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
#main{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="lock" id="lockCard">
    <h2>Cipher</h2>
    <label>Number word</label>
    <input type="text" id="wNum" placeholder="" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="check" id="numCheck"></div>
    <label>Key word</label>
    <input type="text" id="wKey" placeholder="" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="row">
      <label class="tog"><input type="checkbox" id="remember"> Remember on this device</label>
      <button class="btn" id="unlock" disabled>Unlock</button>
    </div>
  </div>

  <div id="main">
    <div class="hdr">
      <div><h1>Cipher</h1></div>
      <div class="words"><span id="wordsTxt"></span><button class="pill ghost" onclick="lock()">Lock</button></div>
    </div>
    <div class="seg"><button id="segEnc" class="on" onclick="setMode('enc')">Make code</button><button id="segDec" onclick="setMode('dec')">Read code</button></div>
    <div class="seg" id="styleSeg"><button id="segWords" class="on" onclick="setStyle('words')">Word code</button><button id="segStrong" onclick="setStyle('strong')">Strong lock</button></div>
    <div class="grid">
      <div class="card">
        <div class="ch"><h2 id="inTitle">Plain</h2><span class="st" id="inStatus"></span></div>
        <textarea id="in" placeholder="Paste here"></textarea>
        <div class="drop" id="drop">Drop a file</div>
        <input type="file" id="file" accept="image/*,.txt,.pdf,text/plain,application/pdf" multiple hidden>
        <div class="foot"><span id="inCount"></span><span><button class="pill ghost" onclick="clearIn()">Clear</button></span></div>
      </div>
      <div class="card">
        <div class="ch"><h2 id="outTitle">Coded</h2><span class="st" id="outStatus"></span></div>
        <textarea id="out" readonly placeholder=""></textarea>
        <div class="foot"><span id="outCount"></span><span><button class="pill ghost" onclick="swap()">Swap sides</button> <button class="pill" onclick="copyOut()">Copy</button></span></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var KEY='cipher_words_v1',W=null,mode='enc',style='words',idleTimer=null;
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function normWord(w){return String(w||'').toUpperCase().replace(/[^A-Z]/g,'')}
function numOk(w){return w.length===10&&new Set(w.split('')).size===10}
function mask(w){return w?w[0]+'\u2022'.repeat(Math.max(1,w.length-2))+w[w.length-1]:'\u2014'}
var SYMS='$,.%-/:@()#&+=?!';
function symLetters(num){var out='';for(var i=65;i<=90;i++){var c=String.fromCharCode(i);if(num.indexOf(c)<0)out+=c}return out}

function encode(text){
  var num=W.num,key=W.key,sl=symLetters(num),out='',ki=0,chars=Array.from(String(text||''));
  for(var i=0;i<chars.length;i++){
    var c=chars[i],cd=c.charCodeAt(0);
    if(cd>=48&&cd<=57){out+=num[(cd-48+9)%10];continue}
    if(/[a-z]/i.test(c)&&cd<128){var p=c.toUpperCase().charCodeAt(0)-65,s=key.charCodeAt(ki%key.length)-65;out+=String.fromCharCode(97+(p+s)%26);ki++;continue}
    var si=SYMS.indexOf(c);
    if(si>-1&&si<sl.length){var prev=chars[i-1]||'',next=chars[i+1]||'';if(/[0-9]/.test(prev)||/[0-9]/.test(next)||(c==='$'&&/[0-9]/.test(chars[i+2]||''))){out+=sl[si];continue}}
    out+=c;
  }
  return out;
}
function decode(text){
  var num=W.num,key=W.key,sl=symLetters(num),out='',ki=0,chars=Array.from(String(text||''));
  for(var i=0;i<chars.length;i++){
    var c=chars[i],cd=c.charCodeAt(0);
    if(cd>=65&&cd<=90){var d=num.indexOf(c);if(d>-1){out+=String((d+1)%10);continue}var si=sl.indexOf(c);if(si>-1&&si<SYMS.length){out+=SYMS[si];continue}out+=c;continue}
    if(cd>=97&&cd<=122){var p=cd-97,s=key.charCodeAt(ki%key.length)-65;out+=String.fromCharCode(97+((p-s)%26+26)%26);ki++;continue}
    out+=c;
  }
  return caps(out);
}
function caps(t){
  t=t.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g,function(m,a,b){return a+b.toUpperCase()});
  return t.replace(/\bi\b/g,'I').replace(/\bi'([md]|ll|ve)\b/g,"I'$1");
}

var enc8=new TextEncoder(),dec8=new TextDecoder();
function b64(bytes){var s='';bytes.forEach(function(b){s+=String.fromCharCode(b)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function aesKey(salt){
  var base=await crypto.subtle.importKey('raw',enc8.encode(W.num+'|'+W.key),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function strongEncode(text){
  if(!text)return '';
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(salt);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc8.encode(text)));
  var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);
  return 'LOCK.'+b64(all);
}
async function strongDecode(text){
  var body=String(text||'').trim().replace(/^LOCK\./,'').replace(/\s+/g,'');
  if(!body)return '';
  var all=unb64(body);if(all.length<29)throw new Error('short');
  var key=await aesKey(all.slice(0,16));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},key,all.slice(28));
  return dec8.decode(pt);
}

/* ═══ page ═══ */
var runSeq=0;
async function run(){
  var t=$('in').value,seq=++runSeq;
  $('inCount').textContent=t.length?t.length+' characters':'';
  if(!W){$('out').value='';return}
  var r='';
  try{
    if(mode==='enc')r=style==='strong'?await strongEncode(t):encode(t);
    else r=/^\s*LOCK\./.test(t)?await strongDecode(t):decode(t);
    $('outStatus').textContent='';
  }catch(e){r='';$('outStatus').textContent='Those words do not open this one'}
  if(seq!==runSeq)return;
  $('out').value=r;$('outCount').textContent=r.length?r.length+' characters':'';
  touch();
}
function setMode(m){
  mode=m;$('segEnc').className=m==='enc'?'on':'';$('segDec').className=m==='dec'?'on':'';
  $('inTitle').textContent=m==='enc'?'Plain':'Coded';$('outTitle').textContent=m==='enc'?'Coded':'Plain';
  $('in').placeholder='Paste here';
  $('styleSeg').style.display=m==='enc'?'':'none';
  run();
}
function setStyle(s){
  style=s;$('segWords').className=s==='words'?'on':'';$('segStrong').className=s==='strong'?'on':'';
  run();
}
function swap(){var o=$('out').value;setMode(mode==='enc'?'dec':'enc');$('in').value=o;run()}
function clearIn(){$('in').value='';run();$('in').focus()}
function copyOut(){var v=$('out').value;if(!v)return;var done=function(){toast('Copied')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,function(){$('out').select();document.execCommand('copy');done()});else{$('out').select();document.execCommand('copy');done()}}

/* ═══ lock screen ═══ */
function checkWords(){
  var num=normWord($('wNum').value),key=normWord($('wKey').value),ok=numOk(num),c=$('numCheck');
  c.className='check '+(num?(ok?'ok':'bad'):'');
  c.textContent=!num||ok?'':(num.length!==10?num.length+' letters, needs 10':'Two letters repeat');
  $('unlock').disabled=!(ok&&key.length>0);
}
function unlock(){
  var num=normWord($('wNum').value),key=normWord($('wKey').value);
  if(!numOk(num)||!key)return;
  W={num:num,key:key};
  try{if($('remember').checked)localStorage.setItem(KEY,JSON.stringify(W));else localStorage.removeItem(KEY)}catch(e){}
  $('wordsTxt').innerHTML='Numbers <b>'+mask(num)+'</b> &nbsp;·&nbsp; Letters <b>'+mask(key)+'</b>';
  $('lockCard').style.display='none';$('main').style.display='block';
  $('wNum').value='';$('wKey').value='';
  setStyle('words');setMode('enc');$('in').focus();
}
function lock(){
  W=null;$('in').value='';$('out').value='';$('inCount').textContent='';$('outCount').textContent='';
  try{localStorage.removeItem(KEY)}catch(e){}
  $('remember').checked=false;
  $('main').style.display='none';$('lockCard').style.display='';checkWords();$('wNum').focus();
}
function touch(){clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(W){lock();toast('Locked, it was quiet for a while')}},20*60*1000)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&W){clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(W&&document.hidden)lock()},10*60*1000)}else touch()});
$('wNum').addEventListener('input',checkWords);$('wKey').addEventListener('input',checkWords);
$('unlock').addEventListener('click',unlock);
[$('wNum'),$('wKey')].forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter'&&!$('unlock').disabled)unlock()})});

function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function ensureOcr(){if(window.Tesseract)return;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
async function ensurePdf(){if(window.pdfjsLib)return;await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
async function imageText(blob){
  await ensureOcr();
  var src=blob;
  try{var bm=await createImageBitmap(blob);if(bm.width<1800){var k=Math.min(3,2400/Math.max(1,bm.width)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);var cx=cv.getContext('2d');cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';cx.drawImage(bm,0,0,cv.width,cv.height);src=cv}}catch(e){}
  var r=await Tesseract.recognize(src,'eng');
  return String(r.data.text||'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function pdfText(blob){
  await ensurePdf();
  var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise,out=[];
  for(var p=1;p<=pdf.numPages;p++){var pg=await pdf.getPage(p),tc=await pg.getTextContent(),line='',lastY=null;tc.items.forEach(function(it){var y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){out.push(line.trim());line=''}line+=(line&&!/\s$/.test(line)?' ':'')+it.str;lastY=y});out.push(line.trim())}
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function takeBlob(blob,name){
  if(!W)return;
  var st=$('inStatus');
  try{
    var t='';
    if(/^image\//.test(blob.type)){st.textContent='Reading the picture, about 20 seconds';t=await imageText(blob)}
    else if(blob.type==='application/pdf'||/\.pdf$/i.test(name||'')){st.textContent='Reading the PDF';t=await pdfText(blob)}
    else{t=await blob.text()}
    if(!t){st.textContent='Nothing readable in that one';return}
    var cur=$('in').value;$('in').value=(cur?cur+'\n\n':'')+t;st.textContent='';run();
  }catch(e){st.textContent='Could not read that file'}
}
$('in').addEventListener('input',run);
$('in').addEventListener('paste',function(e){
  var items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){if(/^image\//.test(items[i].type)){var b=items[i].getAsFile();if(b){e.preventDefault();takeBlob(b,'paste.png');return}}}
});
$('file').addEventListener('change',function(e){Array.prototype.slice.call(e.target.files||[]).forEach(function(f){takeBlob(f,f.name)});e.target.value=''});
(function(){var d=$('drop');d.addEventListener('click',function(){$('file').click()});d.addEventListener('dragover',function(e){e.preventDefault();d.classList.add('on')});d.addEventListener('dragleave',function(){d.classList.remove('on')});d.addEventListener('drop',function(e){e.preventDefault();d.classList.remove('on');Array.prototype.slice.call(e.dataTransfer.files||[]).forEach(function(f){takeBlob(f,f.name)})});
  document.body.addEventListener('dragover',function(e){e.preventDefault()});document.body.addEventListener('drop',function(e){e.preventDefault();Array.prototype.slice.call(e.dataTransfer.files||[]).forEach(function(f){takeBlob(f,f.name)})})})();

(function(){
  try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&numOk(normWord(o.num))&&normWord(o.key)){$('wNum').value=o.num;$('wKey').value=o.key;$('remember').checked=true;unlock();return}}catch(e){}
  checkWords();$('wNum').focus();
})();
</script>
</body>
</html>
